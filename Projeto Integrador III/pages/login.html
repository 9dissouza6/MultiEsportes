<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar — MultiEsportes</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar scrolled" id="navbar">
    <a href="../index.html" class="logo"><img src="../assets/logo.png" alt="MultiEsportes" class="logo-img"/><span class="logo-text">Multi<span>Esportes</span></span></a>
    <div class="nav-actions" id="navActions">
      <a href="cadastro.html" class="btn-outline">Criar conta</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo"><span class="logo-text">Multi<span>Esportes</span></span></a>
      <p class="auth-subtitle">Bem-vindo de volta! Acesse sua conta.</p>

      <div class="alert" id="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required/>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div style="position:relative">
            <input type="password" id="senha" placeholder="••••••••"
              autocomplete="current-password" required
              style="width:100%;padding-right:48px"/>
            <button type="button" id="togglePass"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
              background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-muted)">👁</button>
          </div>
        </div>

        <div style="text-align:right;margin-top:-10px;margin-bottom:20px">
          <a href="#" style="font-size:0.85rem;color:var(--green)">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;gap:10px" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          Entrar
        </button>

        <div class="divider">ou</div>

        <p style="text-align:center;font-size:0.9rem;color:var(--text-muted)">
          Não tem conta?
          <a href="cadastro.html" style="color:var(--green);font-weight:600">Cadastre-se grátis</a>
        </p>
      </form>
    </div>
  </main>

  <!-- CDN primeiro, depois nossos scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/global.js"></script>
  <script>
    document.getElementById('togglePass').addEventListener('click', () => {
      const input = document.getElementById('senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    const alertEl  = document.getElementById('alert');
    const spinner  = document.getElementById('spinner');
    const submitBtn = document.getElementById('submitBtn');

    function setAlert(msg, type = 'error') {
      alertEl.textContent = msg;
      alertEl.className = `alert alert-${type} show`;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'alert';

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      if (!email || !senha) { setAlert('Preencha e-mail e senha.'); return; }

      spinner.classList.add('show');
      submitBtn.disabled = true;
      setAlert('Entrando...', 'info');

      try {
        const { data, error } = await signIn(email, senha);

        if (error) {
          console.error('Erro Supabase:', error);
          const msgs = {
            'Invalid login credentials': 'E-mail ou senha incorretos.',
            'Email not confirmed': 'Confirme seu e-mail antes de entrar.',
          };
          setAlert(msgs[error.message] || `Erro: ${error.message}`);
          return;
        }

        setAlert('✅ Login realizado! Redirecionando...', 'success');
        setTimeout(() => window.location.href = 'perfil.html', 1200);

      } catch (err) {
        console.error('Erro inesperado:', err);
        setAlert('Erro inesperado. Abra o console (F12) para mais detalhes.');
      } finally {
        spinner.classList.remove('show');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
